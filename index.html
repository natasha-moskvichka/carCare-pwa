<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АвтоБорт — Контроль автомобиля</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="АвтоБорт">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🤖 АвтоБорт</h1>
    <p>Контроль расходов и пробега</p>

    <!-- Блок ввода данных (Forms) -->
    <div class="card">
        <h3>📝 Внести данные</h3>
        <div class="input-group">
            <label for="currentMileage">Текущий пробег (км):</label>
            <input type="number" id="currentMileage" placeholder="Например: 45000">
        </div>

        <div class="input-group">
            <label for="oilChangeCost">Стоимость замены масла (₽):</label>
            <input type="number" id="oilChangeCost" placeholder="Например: 6000">
        </div>

        <button id="saveBtn">Сохранить в бортжурнал</button>
    </div>

    <!-- Блок статуса -->
    <div id="status" class="status-ok">Система готова к работе</div>
</div>

<script src="app.js"></script>
</body>

</html>
